{% extends "base.html" %}
{% block title %}Gabung Kelas • Kana Chat{% endblock %}
{% block content %}
  <div style="max-width: 400px; margin: 32px auto;">
    <div class="card card-pad" style="padding: 28px; text-align: center;">
      <h1 style="font-size: 20px; margin: 0 0 4px;">Gabung Kelas</h1>
      <p class="muted small" style="margin: 0 0 20px;">Masukkan kode gabung yang diberikan gurumu.</p>
      <form method="post">
        <div class="field" style="text-align: left;">
          <label for="join_code">Kode gabung</label>
          <input type="text" class="input font-kana" id="join_code" name="join_code" required maxlength="10"
                 placeholder="Contoh: A1B2C3" autocomplete="off"
                 style="text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase;" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Gabung</button>
      </form>
    </div>
  </div>
{% endblock %}
